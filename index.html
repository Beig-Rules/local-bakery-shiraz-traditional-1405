<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>نانوایی سنتی شیراز</title>
<style>:root{--bg:#fff;--text:#111;--muted:#666;--accent:#000;--border:#e5e5e5;--card:#fafafa}[data-theme=dark]{--bg:#0a0a0a;--text:#f5f5f5;--muted:#aaa;--accent:#fff;--border:#222;--card:#111}*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Vazirmatn",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}.container{max-width:720px;margin:0 auto;padding:2rem 1.25rem}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem}h1{font-size:2.5rem;margin-bottom:1rem}.menu{margin:2rem 0}.item{display:flex;justify-content:space-between;padding:1rem 0;border-bottom:1px solid var(--border)}button.theme{background:none;border:1px solid var(--border);color:var(--text);padding:0.4rem 0.8rem;border-radius:6px;cursor:pointer}button.cta{background:var(--accent);color:var(--bg);border:none;padding:0.9rem 1.5rem;border-radius:8px;cursor:pointer;font-weight:600;margin-top:1rem}</style>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"></head>
<body><div class="container"><header><div>نانوایی شیراز</div><button class="theme" onclick="toggleTheme()">تم</button></header><h1>نان تازه هر روز</h1><p style="color:var(--muted)">نان سنگک، بربری و نان محلی شیراز با روش سنتی.</p><div class="menu"><div class="item"><span>نان سنگک</span><span>۱۲،۰۰۰ تومان</span></div><div class="item"><span>نان بربری</span><span>۱۰،۰۰۰ تومان</span></div><div class="item"><span>نان محلی</span><span>۸،۰۰۰ تومان</span></div></div><button class="cta">سفارش تلفنی</button><p style="margin-top:2rem;color:var(--muted)">آدرس: شیراز، خیابان لطف‌علی‌خان زند</p></div>
<script>function toggleTheme(){const h=document.documentElement;const c=h.getAttribute('data-theme')||'light';h.setAttribute('data-theme',c==='light'?'dark':'light');localStorage.setItem('theme',h.getAttribute('data-theme'));}if(localStorage.getItem('theme')==='dark'||(!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');</script></body></html>
